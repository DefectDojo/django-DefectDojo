AWSTemplateFormatVersion: '2010-09-09'
Description: A stack with several template defects.
Parameters:
  UnusedParameter:
    Type: String
    Description: Never referenced anywhere.
  SecondUnused:
    Type: String
    Description: Also never referenced.
Resources:
  ApplicationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: generic-app-bucket
      NotARealProperty: true
  ApplicationQueue:
    Type: AWS::SQS::Queue
    DependsOn: ApplicationBucket
    Properties:
      QueueName: !Sub 'generic-app-queue'
Outputs:
  MissingAttribute:
    Description: References an attribute that does not exist.
    Value: !GetAtt ApplicationBucket.NoSuchAttribute
