name: "Renovate validation"
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
      - release/*

jobs:
  main:
    # Release PRs and merge-backs are merged without waiting for CI. Skip when the
    # head is release/merge-* AND the PR has release-management.
    if: ${{ !(startsWith(github.head_ref, 'release/merge-') && contains(github.event.pull_request.labels.*.name, 'release-management')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate
        uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
        with:
          strict: "true"
          validator_version: 44.158.0 # renovate: datasource=github-releases depName=renovatebot/renovate
