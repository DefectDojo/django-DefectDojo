name: "Build Docker Images For Testing"

on:
  # inspired by https://github.com/orgs/community/discussions/26801 we take the runs-on as parameter so we can run arm64 on native hardwarde
  workflow_dispatch:
    inputs:
        platform:
          type: string
          default: "linux/amd64"
  workflow_call:
    inputs:
        platform:
          type: string
          default: "linux/amd64"

jobs:
  build:
    name: Build Docker Images
    runs-on: ${{ inputs.platform ==  'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        # integration tests are only build (and run) on debian linux/amd64
        docker-image: [django, nginx, integration-tests]
        os: [alpine, debian]
        platform: ["${{ inputs.platform }}"]
        exclude:
            - docker-image: nginx
              os: debian
            - docker-image: integration-tests
              os: alpine
            - docker-image: integration-tests
              platform: linux/arm64

    steps:
      # Replace slashes so we can use this in filenames
      - name: Set-platform
        run: |
          platform=${{ inputs.platform }}
          echo "PLATFORM=${platform//\//-}" >> $GITHUB_ENV
          echo $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Docker Image Identifiers
        id: read-docker-image-identifiers
        run: echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The django image every test job runs carries the latest release's schema snapshot, so its
      # initializer (UI and k8s jobs) or the unit-test entrypoint loads the snapshot into the empty
      # database and applies only the migrations this branch added since that release, instead of
      # every migration from zero (dojo/management/commands/schema_snapshot.py). Published images
      # carry their own release's snapshot (release-x-manual-add-schema-snapshot.yml); CI builds
      # from source, so it adds the latest release's here, from the release assets, as one more
      # stage on top of the Dockerfile's last one. Until a release has a snapshot, the image is
      # built as before and every job migrates from zero.
      - name: Fetch the latest release's schema snapshot
        id: snapshot
        if: matrix.docker-image == 'django'
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          dir="${RUNNER_TEMP}/schema-snapshot"
          mkdir -p "${dir}"
          if ! gh release download --repo "${GITHUB_REPOSITORY}" --dir "${dir}" \
              --pattern schema-snapshot.sql --pattern schema-snapshot.manifest.json; then
            echo "::notice::The latest release has no schema snapshot: building the django image without one"
            exit 0
          fi
          dockerfile="${RUNNER_TEMP}/Dockerfile.django-${OS}"
          cp "Dockerfile.django-${OS}" "${dockerfile}"
          printf '%s\n' '' \
            'FROM django-unittests AS django-unittests-schema-snapshot' \
            'COPY --from=schema-snapshot schema-snapshot.sql /schema-snapshot/migrated.sql' \
            'COPY --from=schema-snapshot schema-snapshot.manifest.json /schema-snapshot/manifest.json' \
            >> "${dockerfile}"
          echo "file=${dockerfile}" >> "$GITHUB_OUTPUT"
          echo "context=schema-snapshot=${dir}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 15
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
        with:
          context: .
          push: false
          tags: defectdojo/defectdojo-${{ matrix.docker-image }}:${{ matrix.os }},${{ env.IMAGE_REPOSITORY }}/defectdojo-${{ matrix.docker-image }}:${{ matrix.os }}
          file: ${{ steps.snapshot.outputs.file || format('Dockerfile.{0}-{1}', matrix.docker-image, matrix.os) }}
          build-contexts: ${{ steps.snapshot.outputs.context }}
          outputs: type=docker,dest=${{ matrix.docker-image }}-${{ matrix.os }}-${{ env.PLATFORM }}_img

      # export docker images to be used in next jobs below
      - name: Upload image ${{ matrix.docker-image }} as artifact
        timeout-minutes: 15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-docker-image-${{ matrix.docker-image }}-${{ matrix.os }}-${{ env.PLATFORM }}
          path: ${{ matrix.docker-image }}-${{ matrix.os }}-${{ env.PLATFORM }}_img
          retention-days: 1
