name: Release Drafter (custom range)

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          The version of the next release that is being created or updated.
          This will override any version calculated by the release-drafter.
        required: false
      filter-by-range:
        description: |
          Semver range limiting which past releases may be picked as the previous release,
          i.e. where the changeset starts. Evaluated per tag with node's semver.satisfies().
          Every release, patch or minor, is cut from dev, so the previous release tag is
          the natural start: leave this empty for the normal case.
          Set it only to start somewhere else, e.g. '3.1.0' for a changeset since 3.1.0.
        required: false
      dry-run:
        description: |
          Log what would be written instead of creating or updating the release draft.
          Use this to confirm the changeset starts at the release you expect.
        required: false
        default: 'false'

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          version: ${{ github.event.inputs.version }}
          filter-by-range: ${{ github.event.inputs['filter-by-range'] }}
          dry-run: ${{ github.event.inputs['dry-run'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
