name: "Release-2: Tag, Release, Push"

env:
  GIT_USERNAME: "DefectDojo release bot"
  GIT_EMAIL: "dojo-release-bot@users.noreply.github.com"

on:
  workflow_dispatch:
    inputs:
      # the actual branch that can be chosen on the UI is made irrelevant by further steps
      # because someone will forget one day to change it.
      release_number:
        type: string
        description: 'Release version (x.y.z format)'
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Configure git
        run: |
          git config --global user.name "${{ env.GIT_USERNAME }}"
          git config --global user.email "${{ env.GIT_EMAIL }}"

      - name: Create new tag ${{ inputs.release_number }}
        # at this point, the PR from the 1st workflow is merged into master.
        run: |
          git tag -a ${{ inputs.release_number }} -m "[bot] release ${{ inputs.release_number }}"
          git push origin ${{ inputs.release_number }}

  publish-docker-containers:
    needs: tag
    strategy:
      matrix:
          platform: ['linux/amd64', 'linux/arm64']
      fail-fast: false
    uses: ./.github/workflows/release-x-manual-docker-containers.yml
    with:
      release_number: ${{ inputs.release_number }}
      platform: ${{ matrix.platform }}
    secrets: inherit

  # Adds the release's schema snapshot to every django image before anything is tagged: the merge
  # below tags the layered digests this replaces.
  add-schema-snapshot:
    needs: publish-docker-containers
    permissions:
      contents: read
    uses: ./.github/workflows/release-x-manual-add-schema-snapshot.yml
    with:
      release_number: ${{ inputs.release_number }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-container-digests:
    needs: add-schema-snapshot
    uses: ./.github/workflows/release-x-manual-merge-container-digests.yml
    with:
      release_number: ${{ inputs.release_number }}
    secrets: inherit

  # for releases we need to tag the images with the latest tag
  # this could be parametrized in the merge-container-digests workflow
  # but it's simpler to just add a explicit workflow for this here
  tag-as-latest:
    needs: publish-container-digests
    uses: ./.github/workflows/release-x-manual-tag-as-latest.yml
    with:
      release_number: ${{ inputs.release_number }}
    secrets: inherit

  release-helm-chart:
    needs: publish-container-digests
    uses: ./.github/workflows/release-x-manual-helm-chart.yml
    with:
      release_number: ${{ inputs.release_number }}
    secrets: inherit

  release-drafter:
    needs: [publish-container-digests, release-helm-chart]
    uses: ./.github/workflows/release-drafter.yml
    with:
      version: ${{ inputs.release_number }}
    secrets: inherit

  # The snapshot the django images now carry, as release assets: CI layers the latest release's onto
  # the images it builds and tests (build-docker-images-for-testing.yml), without pulling an image.
  add-schema-snapshot-to-release:
    needs: [add-schema-snapshot, release-drafter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Load the schema snapshot from artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: schema-snapshot

      - name: Upload the schema snapshot to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          mv migrated.sql schema-snapshot.sql
          mv manifest.json schema-snapshot.manifest.json
          gh release upload "${RELEASE_NUMBER}" \
            schema-snapshot.sql schema-snapshot.manifest.json \
            --clobber --repo "${GITHUB_REPOSITORY}"
