name: Fetch OpenAPI Specifications

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: |
          The version to be associated with the GitHub release that's created or updated.
          This will override any version calculated by the release-drafter.
        required: true

env:
  release_version: ${{ github.event.inputs.version || github.event.inputs.release_number }}

jobs:
  oas_fetch:
    name: Fetch OpenAPI Specifications
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file-type: [yaml, json]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.release_version }}

      - name: Load docker images
        timeout-minutes: 10
        # image pulls from Docker Hub time out every so often, so retry before failing the job
        run: |-
             RETRY=0
             until docker pull defectdojo/defectdojo-django:${{ env.release_version }}-alpine \
                   && docker pull defectdojo/defectdojo-nginx:${{ env.release_version }}-alpine
               do
               if [[ $RETRY -gt 2 ]]; then
                 echo "ERROR: could not pull the release images after $RETRY retries"
                 exit 1
               fi
               RETRY=$((RETRY+1))
               echo "Attempt $RETRY to pull the release images"
               sleep 15
             done
             docker images

      - name: Start Dojo
        timeout-minutes: 10
        # image pulls from Docker Hub time out every so often, so retry before failing the job
        run: |-
             RETRY=0
             until docker compose up --no-deps -d valkey postgres uwsgi nginx
               do
               if [[ $RETRY -gt 2 ]]; then
                 echo "ERROR: could not start Dojo after $RETRY retries"
                 exit 1
               fi
               RETRY=$((RETRY+1))
               echo "Attempt $RETRY to start Dojo"
               sleep 15
             done
        env:
          DJANGO_VERSION: ${{ env.release_version }}-alpine
          NGINX_VERSION: ${{ env.release_version }}-alpine

      - name: Wait for Dojo to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:8080/api/v2/oa3/schema/; do sleep 10; done'

      - name: Download OpenAPI Specifications
        run: |-
             wget 'http://localhost:8080/api/v2/oa3/schema/?format=${{ matrix.file-type }}' -O oas.${{ matrix.file-type }} --tries=10 --retry-on-http-error=502

      - name: Logs
        if: always()
        run: docker compose logs --tail="2500"

      - name: Shutdown
        if: always()
        run: docker compose down

      - name: Upload oas.${{ matrix.file-type }} as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oas-${{ matrix.file-type }}
          path: oas.${{ matrix.file-type }}
          retention-days: 1
