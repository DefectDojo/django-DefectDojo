---
name: Shellcheck
on:
  pull_request:

jobs:
  shellcheck:
    # Release PRs and merge-backs are merged without waiting for CI. Skip when the
    # head is release/merge-* AND the PR has release-management.
    if: ${{ !(startsWith(github.head_ref, 'release/merge-') && contains(github.event.pull_request.labels.*.name, 'release-management')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: 'v0.11.0' # renovate: datasource=github-releases depName=koalaman/shellcheck versioning=loose
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2086  # TODO: fix following findings
