name: "Docs: Dry Run Production Deployment"

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/*'
  # Build the docs on the merge queue's speculative merge commit too, so a docs
  # PR shows this check in the queue and a docs break is caught before landing.
  # merge_group does not support paths filters, so this runs on every merge
  # group. That is deliberate: the in-app link check below reads dojo/, so a
  # code-only PR can break this build as well. It runs in parallel with the
  # unit tests, which take far longer, so on a code merge group it adds no
  # queue time.
  #
  # Not a required check: the queue does not wait for it unless the "Merge
  # Queue" ruleset requires it. Requiring it also needs the pull_request paths
  # filter above removed, or non-docs PRs never report it and cannot queue.
  merge_group:

jobs:
  deploy:
    # Release PRs and merge-backs are merged without waiting for CI. Skip when the
    # head is release/merge-* AND the PR has release-management.
    if: ${{ !(startsWith(github.head_ref, 'release/merge-') && contains(github.event.pull_request.labels.*.name, 'release-management')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.170.1'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1' # TODO: Renovate helper might not be needed here - needs to be fully tested

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check front matter titles for (Pro) / (Open Source)
        # Page titles must not hardcode the edition — that's what the
        # `audience` front matter field is for.
        run: |
          set -euo pipefail
          if grep -rEn --include='*.md' '^title:.*\((Pro|Open Source)\)' docs/content/; then
            echo >&2
            echo 'Found front matter titles hardcoding "(Pro)" or "(Open Source)".' >&2
            echo 'Remove the suffix from the title and use the "audience" front matter field instead.' >&2
            exit 1
          fi

      - name: Refuse DefectDojo Pro pages
        # The DefectDojo Pro pages live in DefectDojo-Inc/dojo-pro-docs, which
        # builds docs.defectdojo.com from them together with the Open Source
        # pages here. A page marked for the Pro view (audience: pro or
        # pro-feature: true), a PRO__* file, or anything under releases/pro/
        # belongs there, not here. A section's _index.md is exempt, and a
        # translation (Name.<lang>.md) is judged by its English page, the same
        # ownership rule that repo's split_pro_docs.py applies.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          CONTENT = Path("docs/content")
          LANGS = ("de", "es", "fr", "it", "ja", "pt-br", "zh-hans")
          FRONT = re.compile(r"\A---\n(.*?)\n---(?:\n|\Z)", re.DOTALL)
          AUDIENCE = re.compile(r"^audience:\s*[\"']?(\w+)", re.MULTILINE)
          PRO_FEATURE = re.compile(r"^pro-feature:\s*true", re.MULTILINE)

          def english(page):
              lang = next((l for l in LANGS if page.name.endswith(f".{l}.md")), None)
              if lang is None:
                  return page
              twin = page.with_name(page.name[: -len(f".{lang}.md")] + ".md")
              return twin if twin.exists() else page

          def pro_owned(page):
              front = FRONT.match(page.read_text(encoding="utf-8"))
              front = front.group(1) if front else ""
              audience = AUDIENCE.search(front)
              return (
                  (audience is not None and audience.group(1) == "pro")
                  or PRO_FEATURE.search(front) is not None
                  or page.name.startswith("PRO__")
                  or page.relative_to(CONTENT).parts[:2] == ("releases", "pro")
              )

          found = sorted(
              str(page)
              for page in CONTENT.rglob("*.md")
              if not page.name.startswith("_index.") and pro_owned(english(page))
          )
          if found:
              print("\n".join(found), file=sys.stderr)
              print(
                  "\nThese pages document DefectDojo Pro. Pro pages live in"
                  " DefectDojo-Inc/dojo-pro-docs (content/), not in this repository:"
                  " open the change there.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Test the build process
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: cd docs && npm ci && hugo --minify --gc --config config/production/hugo.toml

      - name: Give links to the Pro docs a placeholder
        # The published site adds the DefectDojo Pro pages from a separate repo,
        # so this build lacks them. A link this build cannot resolve passes the
        # checks below only if docs.defectdojo.com has it.
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl 'docs\.defectdojo\.com' dojo/ \
            --include='*.html' --include='*.py' --include='*.tpl')
          python3 scripts/docs_live_link_stubs.py docs/public "${files[@]}"

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # --remap makes lychee resolve absolute docs.defectdojo.com URLs against
          # the freshly built site, so absURL-rendered links (e.g. nav menu items)
          # are verified as 404s instead of being skipped as remote URLs.
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/docs/public
            --remap "https://docs.defectdojo.com file://${{ github.workspace }}/docs/public"
            './docs/public/**/*.html'
          fail: true

      - name: Check in-app docs help links
        # Find every file under dojo/ that hardcodes a docs.defectdojo.com URL
        # (templates, settings, etc.) and check those links against the freshly
        # built site. --remap turns the absolute docs URLs into local file lookups;
        # --exclude '%7[BD]' drops URL-encoded Django template tags ({% ... %})
        # so only real external docs URLs are checked. lychee is on $PATH from
        # the previous lychee-action step.
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl 'docs\.defectdojo\.com' dojo/ \
            --include='*.html' --include='*.py' --include='*.tpl')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files reference docs.defectdojo.com — pattern is stale." >&2
            exit 1
          fi
          printf 'Checking in-app docs links in:\n'
          printf '  %s\n' "${files[@]}"
          lychee --offline --no-progress \
            --root-dir "${GITHUB_WORKSPACE}/docs/public" \
            --remap "https://docs.defectdojo.com file://${GITHUB_WORKSPACE}/docs/public" \
            --exclude '%7[BD]' \
            "${files[@]}"

