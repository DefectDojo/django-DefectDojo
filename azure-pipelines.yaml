name: $(Build.SourceBranchName).$(date:yyyyMMdd)$(rev:.r)

trigger:
  tags:
    include:
      - '*'

pool:
  name: Azure Pipelines
  demands: java

steps:
  - task: connect-agent@2
    displayName: "Hosted agent"
    inputs:
      hostedAgentService: $(hostedAgentService)

  - task: UsePythonVersion@0
    displayName: "Use Python 3.12"
    inputs:
      versionSpec: '3.12'
      addToPath: true

  - bash: |
      echo "docker volume"
      docker volume create defectdojo_data_unit_tests

      echo "docker run"
      docker run -d \
        -p 5432:5432/tcp \
        -e POSTGRES_DB=test_defectdojo \
        -e POSTGRES_USER=$(user_pg) \
        -e POSTGRES_PASSWORD=$(password_pg) \
        -v defectdojo_data_unit_tests:/var/lib/postgresql/data \
        $(image)

      docker ps
    displayName: "Start DB"

  - bash: |
      set -e

      echo "-------- Python --------"
      python --version

      echo "-------- Python VirtualEnv --------"
      python -m venv dojodev
      source dojodev/bin/activate

      echo "-------- Upgrade Pip --------"
      python -m pip install --upgrade pip

      echo "-------- System Dependencies --------"
      sudo apt-get update

      sudo apt-get install -y \
        libmysqlclient-dev \
        libmariadb-dev-compat \
        libcurl4-gnutls-dev \
        libgnutls28-dev

      echo "-------- Python Dependencies --------"
      pip install -r requirements.txt \
        -i $(registry) \
        --trusted-host $(trusted-host)

      pip install coverage

      echo "-------- DefectDojo Unit Tests --------"

      unset DD_DATABASE_URL
      unset DD_CELERY_BROKER_URL

      export DD_DATABASE_ENGINE=django.db.backends.postgresql
      export DD_DATABASE_HOST=127.0.0.1
      export DD_DATABASE_PORT=5432
      export DD_DATABASE_NAME=test_defectdojo
      export DD_DATABASE_USER=$(user_pg)
      export DD_DATABASE_PASSWORD=$(password_pg)
      export DD_SECRET_KEY='.'
      export DD_PROVIDER_TOKEN='.'
      export DD_CUSTOM_TAG_PARSER="asff_regex=."

      python manage.py makemigrations dojo
      python manage.py migrate

      coverage run --source='dojo' manage.py test \
        unittests \
        -v 3 \
        --keepdb \
        --no-input \
        --exclude-tag="non-parallel"

      coverage report

      coverage run -a --source='dojo' manage.py test \
        unittests \
        -v 3 \
        --keepdb \
        --no-input \
        --tag="non-parallel"

      coverage report
      coverage xml

    displayName: "Unit test"

  - task: SonarQubePrepare@7
    displayName: "Prepare analysis on SonarQube"
    inputs:
      SonarQube: SonarQube
      scannerMode: CLI
      jdkversion: 'JAVA_HOME_17_X64'
      configMode: manual
      cliProjectKey: "$(DefinitionName)"
      cliProjectName: "$(DefinitionName)"
      cliProjectVersion: "$(Build.BuildNumber)"
      extraProperties: |
        sonar.sourceEncoding=UTF-8
        sonar.sources=dojo
        sonar.tests=unittests
        sonar.python.coverage.reportPaths=*coverage.xml
        sonar.exclusions=**/dojo/db_migrations/**,**/dojo/management/**,**/dojo/static/dojo/js/**,/dojo/settings/unittest.py,**/dojo/templates/notifications/**,**/unittests/**
        sonar.language=py
        sonar.python.version=3.12

  - task: SonarQubeAnalyze@7
    displayName: "Run Code Analysis"

  - bash: |
      cp -r \
        dojo/ \
        requirements.txt \
        docker/ \
        wsgi.py \
        manage.py \
        tests/ \
        unittests/ \
        components/ \
        wsgi_params \
        nginx/ \
        Dockerfile.django-debian \
        Dockerfile.integration-tests-debian \
        Dockerfile.nginx-debian \
        $(Build.ArtifactStagingDirectory)
    displayName: "Copy Files"
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'refs/tags/v'))

  - task: ArchiveFiles@2
    displayName: "Archive Artifact"
    inputs:
      rootFolderOrFile: "$(Build.ArtifactStagingDirectory)"
      includeRootFolder: false
      archiveFile: "$(Build.ArtifactStagingDirectory)/$(DefinitionName).zip"
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'refs/tags/v'))

  - task: PublishBuildArtifacts@1
    displayName: "Publish Artifact: $(DefinitionName)_artifact"
    inputs:
      PathtoPublish: "$(Build.ArtifactStagingDirectory)/$(DefinitionName).zip"
      ArtifactName: "$(DefinitionName)_artifact"
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'refs/tags/v'))

  - task: ArtifactoryGenericUpload@2
    displayName: "Artifactory Generic Upload"
    inputs:
      artifactoryService: Artifactory
      fileSpec: |
        {
          "files": [
            {
              "pattern": "$(Build.ArtifactStagingDirectory)/$(DefinitionName).zip",
              "target": "$(artifactory.RepositoryPath)/$(DefinitionName)/$(Build.BuildNumber)_$(System.JobAttempt)/"
            }
          ]
        }
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'refs/tags/v'))