title = "DefectDojo Documentation"
baseurl = "http://localhost/"
disableAliases = false
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term"]
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
languageCode = "en-US"
pagerSize = 10
rssLimit = 10
summarylength = 20 # 70 (default)

# Multilingual
defaultContentLanguage = "en"
disableLanguages = []
defaultContentLanguageInSubdir = false

copyRight = "Copyright (c) 2020-2025 DefectDojo, Inc."

[build.buildStats]
  enable = true

# Last-modified dates come from each file's latest git commit (enableGitInfo),
# falling back to front matter. The sitemap template emits them as <lastmod>.
# The deploy workflow checks out full history (fetch-depth: 0) so git dates are real.
[frontmatter]
  lastmod = [":git", "lastmod", "modified", "date", "publishDate"]

[outputs]
  home = ["HTML", "RSS", "searchIndex", "SITEMAP"]
  section = ["HTML", "RSS", "SITEMAP"]

[outputFormats.searchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

# /llms.txt (https://llmstxt.org): a plain-text index of the English docs for
# AI assistants, generated from the page tree by layouts/home.llmstxt.txt.
# Enabled for English only, under [en.outputs] in languages.toml.
[outputFormats.llmstxt]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# Add output format for section sitemap.xml
[outputFormats.SITEMAP]
  mediaType = "application/xml"
  baseName = "sitemap"
  isHTML = false
  isPlainText = true
  noUgly = true
  rel  = "sitemap"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "1h"


[taxonomies]
  contributor = "contributors"
  category = "categories"
  tag = "tags"

[permalinks]
  blog = "/blog/:slug/"
  docs = "/en/:sections[1:]/:slug/"
# docs = "/docs/1.0/:sections[1:]/:slug/"

[minify.tdewolff.html]
  keepWhitespace = false

[related]
  threshold = 80
  includeNewer = true
  toLower = false
    [[related.indices]]
      name = "categories"
      weight = 100
    [[related.indices]]
      name = "tags"
      weight = 80
    [[related.indices]]
      name = "date"
      weight = 10

[imaging]
  anchor = "Center"
  bgColor = "#ffffff"
  hint = "photo"
  quality = 85
  resampleFilter = "Lanczos"

[pagination]
  pagerSize = 10