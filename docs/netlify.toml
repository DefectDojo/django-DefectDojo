[build]
  publish = "public"
  functions = "functions"

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_VERSION = "10.2.4"
  HUGO_VERSION = "0.125.1"

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[context.next]
  command = "npm run build"

[context.next.environment]
  HUGO_ENV = "next"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 1313
  port = 8888
  publish = "public"
  autoLaunch = false

# Redirects and rewrites — https://docs.netlify.com/routing/redirects/#syntax-for-the-netlify-configuration-file
#
# Retired URLs are normally handled with Hugo `aliases:` in the target page's
# front matter. These four cannot be:
#
#   - The SSO pages differ from their live URL only by case, and Hugo lowercases
#     alias output, so an alias would collide with the page's own path.
#   - /admin/ and /triage_findings/ are section list pages with no _index.md, so
#     there is no front matter to carry an alias.

[[redirects]]
  from = "/admin/sso/PRO__auth0/"
  to = "/admin/sso/pro__auth0/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/sso/PRO__google/"
  to = "/admin/sso/pro__google/"
  status = 301
  force = true

[[redirects]]
  from = "/en/customize_dojo/"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/en/working_with_findings/"
  to = "/triage_findings/"
  status = 301

# Custom headers — https://docs.netlify.com/routing/headers/#syntax-for-the-netlify-configuration-file
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; manifest-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' https://avatars.githubusercontent.com data:; script-src 'self' 'nonce-dXNlcj0iaGVsbG8iLGRvbWFpbj0iaGVua3ZlcmxpbmRlLmNvbSIsZG9jdW1lbnQud3JpdGUodXNlcisiQCIrZG9tYWluKTs=' 'sha256-aWZ3y/RxbBYKHXH0z8+8ljrHG1mSBvyzSfxSMjBSaXk='; style-src 'self'"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Cache-Control= '''
    public,
    max-age=31536000'''
    Access-Control-Allow-Origin = "*"
