  - q: "On Matching Configuration, you change a tool's hash fields and save. What happens to that tool's existing Findings?"
    options:
      - "Nothing. Only the next import uses the new fields"
      - "Every existing duplicate link for the tool is recalculated"
      - "The tool's existing Findings are deleted and must be imported again"
      - "Their stored hashes are recomputed in the background, but existing duplicate links aren't revisited"
    answer: 3
    why: "Changing hash fields makes every stored hash for that tool stale, so a background re-hash runs. Until it finishes, the tool's Findings may not match each other. Changing only the algorithm recomputes nothing."
    source: "pro__deduplication_tuning/#running-deduplication-retroactively-on-existing-data"
    hints:
      - note: "That's what changing the **algorithm** does. Changing the fields re-hashes the backlog."
        link: "pro__deduplication_tuning/#changing-a-tools-matching"
        label: "Changing a tool's matching"
      - note: "Re-hashing changes what future comparisons produce. To re-link Findings that are already in DefectDojo, use a Dedupe Pool's Apply Now."
        link: "pro__dedupe_pools/#applying-a-pool-to-findings-that-already-exist"
        label: "Applying a pool to existing Findings"
      - note: "Nothing is deleted. The re-hash only updates stored values."
        link: "pro__deduplication_tuning/#running-deduplication-retroactively-on-existing-data"
        label: "Running deduplication retroactively"
      - null

  - q: "**Delete Deduplicate Findings** is on, with **Maximum Duplicates** set to 1. Finding A is an original, and B is already its duplicate. A third import adds Finding C as another duplicate of A. What happens?"
    options:
      - "Finding A is deleted, and B becomes the original"
      - "Finding C is deleted straight away"
      - "Finding B, the oldest duplicate, is deleted. A is never deleted automatically"
      - "Nothing. The setting only applies to Findings imported before it was enabled"
    answer: 2
    why: "Once the limit is crossed, the oldest duplicates are removed first. A background task does it, usually within a minute or two."
