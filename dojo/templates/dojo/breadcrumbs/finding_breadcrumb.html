{% load i18n %}
{% if finding and not custom_breadcrumb %}
<nav aria-label="{% trans 'breadcrumb' %}">
  <ol class="breadcrumb">
  <li><a data-toggle="tooltip" data-placement="top" title="{% trans 'Engagement' %}" href="{% url 'view_engagement' finding.test.engagement.id %}">{{finding.test.engagement.name}}</a></li>
  <li><a data-toggle="tooltip" data-placement="top" title="{% trans 'Test' %}" href="{% url 'view_test' finding.test.id %}">{{finding.test}}</a></li>
  <li><a data-toggle="tooltip" data-placement="top" title="{% trans 'Finding' %}" href="{% url 'view_finding' finding.id %}">{{finding.title|truncatechars:60}}</a></li>
  {% if product_tab.title %}
    <li class="breadcrumb-item active" aria-current="page">{{product_tab.title}}</li>
  {% endif %}
  </ol>
</nav>
{% endif %}
